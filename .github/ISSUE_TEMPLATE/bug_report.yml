name: Bug Report
description: Report a bug in MerchantMaster for World of Warcraft Forever (16001)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please include a **redacted** Debug Bundle from inside the addon (`Console -> Perf & Debug -> Generate Debug Bundle`, keeping **Redact Names** checked).

  - type: checkboxes
    id: client_check
    attributes:
      label: Client Compatibility
      description: MerchantMaster targets World of Warcraft Forever (Interface 16001) only.
      options:
        - label: I am running World of Warcraft Forever (Interface 16001).
          required: true

  - type: input
    id: addon_version
    attributes:
      label: MerchantMaster Version
      description: Copy the version shown in the MerchantMaster window footer or Console Overview.
      placeholder: e.g. v3.3.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the issue.
      placeholder: |
        1. Open Auction House and click Scan AH.
        2. Open Make Profit -> Profit Spread.
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: debug_bundle
    attributes:
      label: Redacted Debug Bundle
      description: |
        Open `/mm console` -> **Perf & Debug** -> ensure **Redact Names** is checked -> click **Generate Debug Bundle**, then paste the redacted output below (along with any Lua error text if applicable).
      render: text
    validations:
      required: true
